<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1836"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="c" x1="42" y1="30" x2="42" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b90ff"/>
      <stop offset="100%" stop-color="#4da3ff"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- "C" ring: full circle stroked with a dasharray gap centered on the right (opening) -->
  <circle cx="42" cy="50" r="20" fill="none" stroke="url(#c)" stroke-width="7"
    stroke-linecap="round" stroke-dasharray="101.26 24.4" stroke-dashoffset="113.46"/>

  <!-- three dots echoing the app's "thinking" indicator -->
  <circle cx="66" cy="43" r="1.8" fill="#5b52a3"/>
  <circle cx="69.5" cy="50" r="2.6" fill="#5b9bff"/>
  <circle cx="66" cy="57" r="1.8" fill="#4a4a7a"/>
</svg>
